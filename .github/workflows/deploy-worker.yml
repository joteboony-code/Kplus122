name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - .github/deploy-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        id: checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-check-log
          path: check.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Deploy Worker
        if: steps.checks.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
